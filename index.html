<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SketchDuel — Draw. Guess. Win.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── SCREEN: HOME ── -->
  <div id="screen-home" class="screen active">
    <div class="home-bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div class="home-content">
      <div class="logo-lockup">
        <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="8" width="32" height="28" rx="4" fill="var(--ink)" />
          <rect x="6" y="10" width="28" height="24" rx="3" fill="var(--paper)" />
          <path d="M12 28 Q18 18 24 24 Q30 30 36 20" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <circle cx="38" cy="34" r="7" fill="var(--accent2)" />
          <path d="M35 34 L38 31 L41 34" stroke="var(--paper)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <h1 class="logo-text">SketchDuel</h1>
      </div>
      <p class="home-tagline">One draws. One guesses.<br/>Both have fun.</p>

      <div class="home-actions">
        <button class="btn btn-primary" id="btn-create">Create lobby</button>
        <div class="divider-or"><span>or</span></div>
        <div class="join-row">
          <input type="text" id="join-code-input" class="code-input" placeholder="Enter code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" />
          <button class="btn btn-secondary" id="btn-join">Join</button>
        </div>
      </div>

      <div id="home-error" class="error-msg" style="display:none"></div>

      <div class="name-prompt" id="name-prompt" style="display:none">
        <input type="text" id="player-name-input" class="name-input" placeholder="Your name" maxlength="18" autocomplete="off" />
        <button class="btn btn-primary" id="btn-confirm-name">Let's go</button>
      </div>
    </div>
  </div>

  <!-- ── SCREEN: LOBBY ── -->
  <div id="screen-lobby" class="screen">
    <div class="home-bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>
    <div class="lobby-content">
      <div class="lobby-header">
        <h2 class="section-title">Lobby</h2>
        <div class="lobby-code-badge">
          <span class="code-label">Code</span>
          <span id="lobby-code-display" class="code-value">——</span>
          <button class="copy-btn" id="btn-copy-code" title="Copy code">
            <svg viewBox="0 0 20 20" fill="none"><rect x="7" y="7" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M4 13V4a1 1 0 011-1h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div class="players-list" id="players-list"></div>

      <div id="lobby-waiting" class="waiting-msg">Waiting for another player to join…</div>
      <div id="lobby-ready" class="ready-msg" style="display:none">Both players connected!</div>

      <button class="btn btn-primary" id="btn-start-game" style="display:none">Start game</button>
      <button class="btn btn-ghost" id="btn-leave-lobby">Leave lobby</button>
    </div>
  </div>

  <!-- ── SCREEN: GAME ── -->
  <div id="screen-game" class="screen">
    <div class="game-layout">

      <!-- Sidebar -->
      <div class="game-sidebar">
        <div class="sidebar-header">
          <span class="sidebar-logo">SketchDuel</span>
          <div class="round-badge">Round <span id="round-display">1</span></div>
        </div>

        <div class="role-card" id="role-card">
          <div class="role-label" id="role-label">Your role</div>
          <div class="role-value" id="role-value">—</div>
        </div>

        <div class="word-card" id="word-card" style="display:none">
          <div class="word-label">Draw this</div>
          <div class="word-value" id="word-display">—</div>
        </div>

        <div class="timer-block">
          <div class="timer-arc-wrap">
            <svg class="timer-arc" viewBox="0 0 80 80">
              <circle class="arc-bg" cx="40" cy="40" r="34" />
              <circle class="arc-fg" id="arc-fg" cx="40" cy="40" r="34"
                stroke-dasharray="213.6" stroke-dashoffset="0" />
            </svg>
            <span class="timer-text" id="timer-text">90</span>
          </div>
          <span class="timer-label">seconds left</span>
        </div>

        <div class="players-mini" id="players-mini"></div>

        <div class="score-block">
          <div class="score-row" id="score-row"></div>
        </div>
      </div>

      <!-- Main canvas area -->
      <div class="game-main">
        <div class="canvas-area">
          <canvas id="draw-canvas"></canvas>
          <div class="canvas-overlay" id="canvas-overlay">
            <p id="overlay-msg">Waiting for the drawer…</p>
          </div>
        </div>

        <!-- Toolbar (drawer only) -->
        <div class="toolbar" id="toolbar" style="display:none">
          <div class="tool-group">
            <button class="tool-btn active" data-tool="pen" title="Pen">
              <svg viewBox="0 0 20 20" fill="none"><path d="M3 17l4-1L16 7a1 1 0 000-1.4L14.4 4a1 1 0 00-1.4 0L4 13l-1 4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            </button>
            <button class="tool-btn" data-tool="eraser" title="Eraser">
              <svg viewBox="0 0 20 20" fill="none"><path d="M4 14l6-6 6 6M9 17h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 14l3 3h4l3-3-5-5-5 5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/></svg>
            </button>
          </div>
          <div class="tool-group colors-group" id="color-swatches"></div>
          <div class="tool-group">
            <label class="size-label">Size</label>
            <input type="range" id="brush-size" min="2" max="40" value="6" class="size-slider" />
          </div>
          <button class="tool-btn clear-btn" id="btn-clear" title="Clear canvas">
            <svg viewBox="0 0 20 20" fill="none"><path d="M4 4l12 12M4 16L16 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>

        <!-- Guess area (guesser only) -->
        <div class="guess-area" id="guess-area" style="display:none">
          <div class="guess-feedback" id="guess-feedback"></div>
          <div class="guess-input-row">
            <input type="text" id="guess-input" class="guess-input" placeholder="Type your guess…" autocomplete="off" />
            <button class="btn btn-accent" id="btn-guess">Guess</button>
          </div>
        </div>

        <!-- Chat / guess history -->
        <div class="chat-log" id="chat-log"></div>
      </div>
    </div>
  </div>

  <!-- ── SCREEN: ROUND END ── -->
  <div id="screen-roundend" class="screen">
    <div class="home-bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>
    <div class="roundend-content">
      <div class="roundend-result" id="roundend-result">
        <div class="result-icon" id="result-icon">🎉</div>
        <h2 class="result-title" id="result-title">Correct!</h2>
        <p class="result-sub" id="result-sub"></p>
      </div>
      <div class="score-summary" id="score-summary"></div>
      <button class="btn btn-primary" id="btn-next-round" style="display:none">Next round</button>
      <div class="waiting-next" id="waiting-next" style="display:none">Waiting for host to start next round…</div>
    </div>
  </div>

  <!-- ── SCREEN: GAME OVER ── -->
  <div id="screen-gameover" class="screen">
    <div class="home-bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div class="gameover-content">
      <div class="trophy">🏆</div>
      <h2 class="gameover-title">Game Over</h2>
      <div class="winner-announce" id="winner-announce"></div>
      <div class="final-scores" id="final-scores"></div>
      <button class="btn btn-primary" id="btn-play-again">Play again</button>
      <button class="btn btn-ghost" id="btn-home">Back to home</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module" src="app.js"></script>
</body>
</html>
